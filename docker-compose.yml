version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_DEPLOYMENT_NAME=${OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - COMPILER_SERVICE_URL=http://compiler:8000
    depends_on:
      - compiler
    networks:
      - review-network

  compiler:
    build: ./compiler
    # Forced to amd64: Android build tooling (AAPT2, D8, NDK toolchains,
    # etc.) is published per-platform, and arm64 native artifacts aren't
    # reliably available/resolved across the whole range of AGP/Gradle
    # versions an arbitrary uploaded project might use. Pinning the whole
    # container to amd64 (run under Rosetta/QEMU on an Apple Silicon host)
    # keeps every native binary a project pulls in on the one architecture
    # that's universally published, instead of hitting a mismatch only on
    # some projects.
    platform: linux/amd64
    networks:
      - review-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - review-network

networks:
  review-network:
    driver: bridge
