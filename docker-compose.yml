version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_DEPLOYMENT_NAME=${OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - COMPILER_SERVICE_URL=http://compiler:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      # mac_build_agent runs natively on the host Mac (never containerized --
      # Linux containers never have Xcode), started manually the same way
      # Ollama is: `uvicorn main:app --port 8100` from mac_build_agent/.
      - IOS_BUILD_AGENT_URL=http://host.docker.internal:8100
    depends_on:
      - compiler
    networks:
      - review-network

  compiler:
    build: ./compiler
    # Forced to amd64: confirmed against a real production project whose
    # AAPT2 resolution picks the x86_64 Linux artifact unconditionally --
    # it failed the exact same way running natively on arm64 as it did
    # under amd64 emulation (before this pin existed), proving it's not
    # host-arch-aware. Native arm64 is faster where it works, but this
    # project (and potentially others) hard-requires x86_64 regardless of
    # host architecture, so amd64 is the trade-off that actually holds for
    # "any project," not just the common case.
    platform: linux/amd64
    volumes:
      # Persists downloaded Gradle distributions + the Maven dependency
      # cache across container recreations (the image itself only bakes in
      # the JDK/SDK/fallback Gradle -- a project's own wrapper version and
      # its dependencies land here instead, and would otherwise re-download
      # from scratch every time this container gets rebuilt/recreated).
      - gradle-cache:/root/.gradle
    networks:
      - review-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - review-network

networks:
  review-network:
    driver: bridge

volumes:
  gradle-cache:
