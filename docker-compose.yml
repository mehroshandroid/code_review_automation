version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_DEPLOYMENT_NAME=${OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
    networks:
      - review-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - review-network

networks:
  review-network:
    driver: bridge
