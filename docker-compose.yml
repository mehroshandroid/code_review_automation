version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_DEPLOYMENT_NAME=${OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - COMPILER_SERVICE_URL=http://compiler:8000
    depends_on:
      - compiler
    networks:
      - review-network

  compiler:
    build: ./compiler
    # Native arm64 (no platform pin) -- much faster than forcing amd64
    # emulation on an Apple Silicon host. One project previously hit an
    # AAPT2 x86_64/arm64 native-binary mismatch; if that recurs, the fix
    # is to reintroduce `platform: linux/amd64` (see git history) as a
    # deliberate speed-vs-compatibility trade-off, not silently re-add it.
    volumes:
      # Persists downloaded Gradle distributions + the Maven dependency
      # cache across container recreations (the image itself only bakes in
      # the JDK/SDK/fallback Gradle -- a project's own wrapper version and
      # its dependencies land here instead, and would otherwise re-download
      # from scratch every time this container gets rebuilt/recreated).
      - gradle-cache:/root/.gradle
    networks:
      - review-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - review-network

networks:
  review-network:
    driver: bridge

volumes:
  gradle-cache:
